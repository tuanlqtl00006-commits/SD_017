<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#031722" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#bgG)" />
  
  <g transform="translate(30, 36)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#38bdf8" fill-opacity="0.18" />
    <text x="50" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">YONEX</text>
  </g>
  <g transform="translate(370, 36)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" />
    <text x="50" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Trắng Bền Bỉ</text>
  </g>

  <!-- Gear Center Visual -->
  <g filter="url(#dropShadow)" transform="translate(100, 90)">
    
      <!-- String / Grip Reel -->
      <circle cx="150" cy="150" r="90" fill="#0284c7" stroke="#38bdf8" stroke-width="8" />
      <circle cx="150" cy="150" r="70" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" />
      <circle cx="150" cy="150" r="40" fill="#0f172a" />
      <text x="150" y="156" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">Cước</text>
    
  </g>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 420)">
    <rect x="24" y="0" width="452" height="60" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="44" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Cước Đan Vợt Yonex BG65</text>
    <text x="44" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Tiêu chuẩn thi đấu quốc tế</text>
    <circle cx="440" cy="30" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <path d="M 436,30 L 439,33 L 445,27" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>