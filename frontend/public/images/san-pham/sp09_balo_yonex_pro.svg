<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0a1024" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#bgG)" />
  
  <g transform="translate(30, 36)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#0284c7" fill-opacity="0.18" />
    <text x="50" y="17" fill="#0284c7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">YONEX</text>
  </g>
  <g transform="translate(370, 36)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" />
    <text x="50" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Đen Xanh Pro</text>
  </g>

  <!-- Gear Center Visual -->
  <g filter="url(#dropShadow)" transform="translate(100, 90)">
    
      <!-- Badminton Bag -->
      <path d="M 40,160 C 40,120 100,100 200,110 C 260,115 280,140 280,190 C 280,240 220,250 150,250 C 70,250 40,210 40,160 Z" fill="#1e293b" />
      <path d="M 60,150 C 100,130 180,130 250,160" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
      <rect x="100" y="80" width="100" height="30" rx="8" fill="none" stroke="#0284c7" stroke-width="5" />
      <text x="150" y="195" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle">Yonex</text>
    
  </g>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 420)">
    <rect x="24" y="0" width="452" height="60" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="44" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Balo Cầu Lông Yonex Pro 26L</text>
    <text x="44" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Tiêu chuẩn thi đấu quốc tế</text>
    <circle cx="440" cy="30" r="14" fill="#0284c7" fill-opacity="0.2" />
    <path d="M 436,30 L 439,33 L 445,27" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>