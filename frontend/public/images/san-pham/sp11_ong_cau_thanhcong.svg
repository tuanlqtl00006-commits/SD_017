<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#bgG)" />
  
  <g transform="translate(30, 36)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#eab308" fill-opacity="0.18" />
    <text x="50" y="17" fill="#eab308" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">THÀNH CÔNG</text>
  </g>
  <g transform="translate(370, 36)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" />
    <text x="50" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ống 12 quả</text>
  </g>

  <!-- Gear Center Visual -->
  <g filter="url(#dropShadow)" transform="translate(100, 90)">
    
      <!-- Shuttlecock Visual -->
      <path d="M 110,80 L 190,80 L 175,190 L 125,190 Z" fill="#ffffff" fill-opacity="0.9" />
      <ellipse cx="150" cy="80" rx="40" ry="12" fill="#f1f5f9" />
      <path d="M 115,115 L 185,115 M 120,150 L 180,150" stroke="#eab308" stroke-width="2" />
      <line x1="120" y1="80" x2="130" y2="190" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="135" y1="80" x2="140" y2="190" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="150" y1="80" x2="150" y2="190" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="165" y1="80" x2="160" y2="190" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="180" y1="80" x2="170" y2="190" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Cork base -->
      <path d="M 125,190 C 125,230 175,230 175,190 Z" fill="#fef08a" />
      <rect x="125" y="190" width="50" height="8" fill="#b91c1c" />
    
  </g>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 420)">
    <rect x="24" y="0" width="452" height="60" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="44" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Ống Quả Cầu Lông Thành Công 77</text>
    <text x="44" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Tiêu chuẩn thi đấu quốc tế</text>
    <circle cx="440" cy="30" r="14" fill="#eab308" fill-opacity="0.2" />
    <path d="M 436,30 L 439,33 L 445,27" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>