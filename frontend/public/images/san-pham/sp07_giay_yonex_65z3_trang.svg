<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#bgG)" />
  
  <g transform="translate(30, 36)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#ea580c" fill-opacity="0.18" />
    <text x="50" y="17" fill="#ea580c" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">YONEX</text>
  </g>
  <g transform="translate(370, 36)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" />
    <text x="50" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Trắng Cam</text>
  </g>

  <!-- Shoe Profile Silhouette -->
  <g filter="url(#dropShadow)" transform="translate(30, 50)">
    <!-- Sole -->
    <path d="M 60,310 C 100,320 220,320 310,315 C 360,312 400,290 410,265 C 400,278 350,295 300,296 C 220,298 120,295 60,295 Z" fill="#e2e8f0" />
    <path d="M 60,315 C 100,325 220,325 310,320 C 365,317 405,295 415,268 L 410,265 C 360,312 310,315 60,310 Z" fill="#ea580c" />
    <!-- Midsole Cushion Bubble -->
    <ellipse cx="140" cy="308" rx="35" ry="7" fill="#ea580c" fill-opacity="0.8" />
    
    <!-- Shoe Upper Body -->
    <path d="M 65,295 C 65,230 110,210 160,210 C 200,210 240,240 290,245 C 340,250 390,260 410,265 C 400,285 360,295 310,296 C 220,298 120,295 65,295 Z" fill="#f8fafc" />
    <!-- Dynamic Accent Stripes -->
    <path d="M 170,225 C 220,245 280,260 360,265" stroke="#ea580c" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 185,240 C 230,255 280,268 350,273" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Tongue & Collar -->
    <path d="M 140,210 C 130,175 160,165 180,180 C 190,190 200,210 210,225 Z" fill="#cbd5e1" />
    <!-- Laces -->
    <line x1="175" y1="200" x2="225" y2="225" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <line x1="190" y1="210" x2="240" y2="235" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <line x1="205" y1="220" x2="255" y2="245" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <!-- Heel Counter -->
    <path d="M 65,295 C 60,250 80,220 110,215 L 115,245 C 95,255 85,275 85,295 Z" fill="#ea580c" />
  </g>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 420)">
    <rect x="24" y="0" width="452" height="60" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="44" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Giày Yonex Power Cushion 65Z3</text>
    <text x="44" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Power Cushion+ · Bám sân êm ái</text>
    <circle cx="440" cy="30" r="14" fill="#ea580c" fill-opacity="0.2" />
    <path d="M 436,30 L 439,33 L 445,27" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>