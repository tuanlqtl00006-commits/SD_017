<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FootStyle - Quản trị</title>
    <!-- Màn chờ: CSS viết sẵn ở đây để hiện ngay lúc mở / F5 / nhân bản tab, không phải chờ JS hay CSS từ CDN (trước đây trang trắng) -->
    <style>
      .fs-cho {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f7fb;
        color: #0977ec;
        font: 600 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .fs-cho-vong {
        width: 38px;
        height: 38px;
        border: 3px solid #d5e5fb;
        border-top-color: #0977ec;
        border-radius: 50%;
        animation: fs-xoay 0.8s linear infinite;
      }
      @keyframes fs-xoay {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bootstrap cần có trước khi giao diện hiện (tránh nháy giao diện chưa có CSS) nên vẫn tải chặn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Biểu tượng và phông chữ không chặn vẽ trang: tải song song, có rồi thì tự áp dụng -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
    </noscript>
  </head>
  <body>
    <!-- Vue thay toàn bộ nội dung #app khi giao diện sẵn sàng -->
    <div id="app">
      <div class="fs-cho" role="status" aria-live="polite">
        <div class="fs-cho-vong" aria-hidden="true"></div>
        <span>FootStyle đang tải…</span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
