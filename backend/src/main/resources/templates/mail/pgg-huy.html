<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo về phiếu giảm giá</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f9;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:560px;background:#ffffff;border:1px solid #e6eaf0;border-radius:12px;">
                <tr th:replace="~{mail/fragments :: dauThu}"></tr>
                <tr th:replace="~{mail/fragments :: loiChao}"></tr>
                <tr>
                    <td style="padding:12px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#4b5563;">
                        Rất tiếc, phiếu giảm giá dưới đây <b style="color:#18242f;">không còn áp dụng</b>
                        cho tài khoản của bạn và sẽ không dùng được khi thanh toán:
                    </td>
                </tr>
                <tr th:replace="~{mail/fragments :: theVoucherHuy}"></tr>
                <tr>
                    <td style="padding:12px 32px 0 32px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#4b5563;">
                        Mong bạn thông cảm. <b style="color:#18242f;">FootStyle</b> sẽ sớm gửi đến bạn
                        nhiều ưu đãi hấp dẫn khác!
                    </td>
                </tr>
                <tr th:replace="~{mail/fragments :: nutBam('Xem sản phẩm')}"></tr>
                <tr th:replace="~{mail/fragments :: chanThu}"></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
