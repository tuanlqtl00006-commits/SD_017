spring.application.name=backend
# Mặc định cổng 8081. Nếu bị báo "Port 8081 was already in use" mà chưa tắt được tiến trình cũ,
# đặt biến môi trường SERVER_PORT=8082 (và VITE_API_TARGET=http://localhost:8082 cho frontend) để chạy cổng khác.
server.port=${SERVER_PORT:8081}

# SQL Server: chạy database/SD_17_tong.sql (tạo DB shop_cau_long_footstyle + dữ liệu mẫu)
# Có thể đổi bằng biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD mà không cần sửa file.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=shop_cau_long_footstyle;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu trúc bảng do file SQL quản lý, Hibernate không tự tạo/sửa bảng.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Ảnh sản phẩm tải lên từ máy: lưu vào thư mục này (tính từ thư mục chạy backend), xem lại qua /api/uploads/ten-file
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===== Giảm giá =====
# Cách tính khi MỘT biến thể nằm trong nhiều đợt giảm giá chạy cùng ngày:
#   MAX        = lấy mức giảm cao nhất (mặc định, vd 10% và 15% -> 15%)
#   TRUNG_BINH = trung bình cộng các đợt (vd 10% và 15% -> 12,5%)
app.giam-gia.che-do-chong-dot=${GIAM_GIA_CHE_DO:MAX}

# ---- Gửi mail phiếu giảm giá cá nhân (phiếu mới / cập nhật / hủy) ----
# Muốn gửi mail thật: đặt biến môi trường (hoặc bỏ dấu # ở các dòng dưới và điền thông tin). Ví dụ Gmail:
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587  SPRING_MAIL_USERNAME=email@gmail.com
#   SPRING_MAIL_PASSWORD=<mật khẩu ứng dụng 16 ký tự>  (Gmail cần bật xác minh 2 bước rồi tạo "Mật khẩu ứng dụng")
# Chưa cấu hình host thì hệ thống KHÔNG gửi mail thật, chỉ ghi nội dung mail vào log để thử chức năng.
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
# Địa chỉ người gửi hiển thị (để trống thì dùng spring.mail.username)
app.mail.from=${MAIL_FROM:}
app.mail.ten-cua-hang=FootStyle
