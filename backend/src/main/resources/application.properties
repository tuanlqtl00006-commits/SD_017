spring.application.name=backend
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=shop_cau_long_footstyle;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

app.giam-gia.che-do-chong-dot=${GIAM_GIA_CHE_DO:MAX}

spring.config.import=optional:classpath:mail.properties
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN PLAIN
app.mail.from=${MAIL_FROM:}
app.mail.ten-cua-hang=FootStyle
app.mail.link-cua-hang=${APP_LINK_CUA_HANG:}

# ===== Đăng nhập + phân quyền (giai đoạn 3) =====
# Bật / tắt đăng nhập. false = bỏ qua đăng nhập, mọi request chạy với quyền của quản lý đầu tiên.
app.auth.bat=${APP_AUTH_BAT:true}
app.auth.bi-mat=${APP_AUTH_BI_MAT:FootStyle-SD17-chuoi-bi-mat-mac-dinh-hay-doi-khi-trien-khai}
app.auth.thoi-han-gio=${APP_AUTH_THOI_HAN_GIO:12}
app.thanh-toan.gia-lap=${APP_THANH_TOAN_GIA_LAP:true}

# ===== Miễn phí vận chuyển theo giá trị đơn (Cài đặt -> Cài đặt free ship) =====
# Quản lý sửa trên giao diện, lưu ở <app.cai-dat-dir>/van-chuyen.json. Các dòng dưới chỉ là giá trị ban đầu khi chưa có tệp đó.
app.cai-dat-dir=${CAI_DAT_DIR:cai-dat}
app.van-chuyen.mien-phi-bat=${VAN_CHUYEN_MIEN_PHI_BAT:true}
app.van-chuyen.mien-phi-tu=${VAN_CHUYEN_MIEN_PHI_TU:2000000}
# Phí giao hàng mỗi đơn khi chưa đạt mức miễn phí (số tạm, quản lý sửa ở Cài đặt free ship)
app.van-chuyen.phi-giao-hang=${VAN_CHUYEN_PHI_GIAO_HANG:25000}
# Phí theo quãng đường (API bản đồ miễn phí OpenStreetMap): phí giao hàng ở trên cho km-co-ban km đầu, mỗi buoc-km km tiếp theo cộng phi-moi-buoc. Số tạm, cửa hàng tự đặt.
app.van-chuyen.km-co-ban=${VAN_CHUYEN_KM_CO_BAN:10}
app.van-chuyen.buoc-km=${VAN_CHUYEN_BUOC_KM:50}
app.van-chuyen.phi-moi-buoc=${VAN_CHUYEN_PHI_MOI_BUOC:1000}
# Tắt (false) thì không gọi bản đồ, tính theo bảng phí tỉnh
app.van-chuyen.ban-do-bat=${VAN_CHUYEN_BAN_DO_BAT:true}

# ===== Thông tin cửa hàng (trợ lý ảo trả lời khách) =====
app.cua-hang.ten=${APP_CUA_HANG_TEN:FootStyle}
# Giá trị có dấu viết dạng mã unicode (gạch chéo, chữ u, 4 số hex): Spring đọc file .properties theo ISO-8859-1, gõ thẳng chữ có dấu sẽ bị lỗi font
app.cua-hang.dia-chi=${APP_CUA_HANG_DIA_CHI:123 \u0110\u01b0\u1eddng C\u1ea7u Di\u1ec5n, B\u1eafc T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i}
app.cua-hang.hotline=${APP_CUA_HANG_HOTLINE:0977 508 430}
app.cua-hang.gio-mo-cua=${APP_CUA_HANG_GIO_MO_CUA:8:00 - 21:30 t\u1ea5t c\u1ea3 c\u00e1c ng\u00e0y trong tu\u1ea7n}
