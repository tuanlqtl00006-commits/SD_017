spring.application.name=backend
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=shop_cau_long_footstyle;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

app.giam-gia.che-do-chong-dot=${GIAM_GIA_CHE_DO:MAX}

spring.config.import=optional:classpath:mail.properties
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.mail.from=${MAIL_FROM:}
app.mail.ten-cua-hang=FootStyle
app.mail.link-cua-hang=${APP_LINK_CUA_HANG:}