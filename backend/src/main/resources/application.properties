spring.application.name=backend
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=shop_cau_long_footstyle;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

app.giam-gia.che-do-chong-dot=${GIAM_GIA_CHE_DO:MAX}

spring.config.import=optional:classpath:mail.properties
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN PLAIN
app.mail.from=${MAIL_FROM:}
app.mail.ten-cua-hang=FootStyle
app.mail.link-cua-hang=${APP_LINK_CUA_HANG:}

# ===== Đăng nhập + phân quyền (giai đoạn 3) =====
# Bật / tắt đăng nhập. false = bỏ qua đăng nhập, mọi request chạy với quyền của quản lý đầu tiên.
app.auth.bat=${APP_AUTH_BAT:true}
app.auth.bi-mat=${APP_AUTH_BI_MAT:FootStyle-SD17-chuoi-bi-mat-mac-dinh-hay-doi-khi-trien-khai}
app.auth.thoi-han-gio=${APP_AUTH_THOI_HAN_GIO:12}
app.thanh-toan.gia-lap=${APP_THANH_TOAN_GIA_LAP:true}

# ===== Miễn phí vận chuyển theo giá trị đơn (Cài đặt -> Cài đặt free ship) =====
# Quản lý sửa trên giao diện, lưu ở <app.cai-dat-dir>/van-chuyen.json. Hai dòng dưới chỉ là giá trị ban đầu khi chưa có tệp đó.
app.cai-dat-dir=${CAI_DAT_DIR:cai-dat}
app.van-chuyen.mien-phi-bat=${VAN_CHUYEN_MIEN_PHI_BAT:true}
app.van-chuyen.mien-phi-tu=${VAN_CHUYEN_MIEN_PHI_TU:2000000}

# ===== Thông tin cửa hàng (trợ lý ảo trả lời khách) =====
app.cua-hang.ten=${APP_CUA_HANG_TEN:FootStyle}
app.cua-hang.dia-chi=${APP_CUA_HANG_DIA_CHI:Số 15 ngõ 120 Trần Phú, phường Hà Đông, Hà Nội}
app.cua-hang.hotline=${APP_CUA_HANG_HOTLINE:0912 000 001}
app.cua-hang.gio-mo-cua=${APP_CUA_HANG_GIO_MO_CUA:7:00 - 22:00 tất cả các ngày trong tuần}
