# ===== Giảm giá =====
# Cách tính khi MỘT biến thể nằm trong nhiều đợt giảm giá chạy cùng ngày:
#   MAX        = lấy mức giảm cao nhất (mặc định, vd 10% và 15% -> 15%)
#   TRUNG_BINH = trung bình cộng các đợt (vd 10% và 15% -> 12,5%)
app.giam-gia.che-do-chong-dot=${GIAM_GIA_CHE_DO:MAX}

# ---- Gửi mail phiếu giảm giá cá nhân (phiếu mới / cập nhật / hủy) ----
# Mặc định dùng Gmail. KHÔNG ghi mật khẩu thật vào file này, hãy đặt 2 biến môi trường trước khi chạy backend
# (IntelliJ: Run > Edit Configurations > Environment variables):
#   MAIL_USERNAME = địa chỉ Gmail của shop
#   MAIL_PASSWORD = "Mật khẩu ứng dụng" 16 ký tự (Tài khoản Google > Bảo mật > Xác minh 2 bước > Mật khẩu ứng dụng)
# (Vẫn dùng được kiểu cũ SPRING_MAIL_HOST / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD.)
# Chưa đặt MAIL_USERNAME thì hệ thống KHÔNG gửi mail thật, chỉ ghi nội dung mail vào log để thử chức năng.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
# Địa chỉ người gửi hiển thị (để trống thì dùng spring.mail.username)
app.mail.from=${MAIL_FROM:}
app.mail.ten-cua-hang=FootStyle
# Link nút "Mua sắm ngay" trong mail gửi khách (đổi bằng biến môi trường SHOP_URL khi có trang shop thật)
app.shop-url=${SHOP_URL:http://localhost:5173}
# Thymeleaf chỉ dùng để dựng nội dung mail (mẫu ở resources/templates/mail), không dùng cho trang web
spring.thymeleaf.check-template-location=false
