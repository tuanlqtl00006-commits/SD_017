spring.application.name=backend
# Mặc định cổng 8081. Nếu bị báo "Port 8081 was already in use" mà chưa tắt được tiến trình cũ,
# đặt biến môi trường SERVER_PORT=8082 (và VITE_API_TARGET=http://localhost:8082 cho frontend) để chạy cổng khác.
server.port=${SERVER_PORT:8081}

# SQL Server: chạy database/SD_17.sql (tạo DB shop_cau_long_footstyle) rồi database/SD_17_du_lieu_va_nang_cap.sql (dữ liệu mẫu + nâng cấp)
# Có thể đổi bằng biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD mà không cần sửa file.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=shop_cau_long_footstyle;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu trúc bảng do file SQL quản lý, Hibernate không tự tạo/sửa bảng.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Ảnh sản phẩm tải lên từ máy: lưu vào thư mục này (tính từ thư mục chạy backend), xem lại qua /api/uploads/ten-file
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===== Giảm giá =====
# Cách tính khi MỘT biến thể nằm trong nhiều đợt giảm giá chạy cùng ngày:
#   MAX        = lấy mức giảm cao nhất (mặc định, vd 10% và 15% -> 15%)
#   TRUNG_BINH = trung bình cộng các đợt (vd 10% và 15% -> 12,5%)
app.giam-gia.che-do-chong-dot=${GIAM_GIA_CHE_DO:MAX}

# ---- Gửi mail phiếu giảm giá cá nhân (phiếu mới / cập nhật / hủy) ----
# CÁCH BẬT GỬI GMAIL THẬT: mở file backend/src/main/resources/mail.properties, điền email Gmail + MẬT KHẨU ỨNG DỤNG (16 ký tự), lưu, chạy lại backend.
# File đó được nạp tự động ngay dưới đây (không có file cũng không lỗi). Dùng biến môi trường SPRING_MAIL_* thay cho file cũng được.
# Chưa điền thì hệ thống KHÔNG gửi mail thật, chỉ ghi nội dung mail vào log, và giao diện báo rõ là "chưa gửi".
# Thử cấu hình mà không cần tạo phiếu: mở http://localhost:8081/api/phieu-giam-gia/thu-gui-mail
spring.config.import=optional:classpath:mail.properties
# Chờ tối đa (mili giây) khi nối / gửi / đọc phản hồi của Gmail, tránh treo luồng gửi khi mất mạng
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
# Địa chỉ người gửi hiển thị (để trống thì dùng spring.mail.username)
app.mail.from=${MAIL_FROM:}
app.mail.ten-cua-hang=FootStyle
# Địa chỉ web của cửa hàng (vd https://footstyle.vn). Có địa chỉ thì thư phiếu mới / cập nhật có nút "Mua sắm ngay"; để trống thì không hiện nút.
app.mail.link-cua-hang=${APP_LINK_CUA_HANG:}
